server:
  port: 7000

spring:
  application:
    name: api-gateway
  config:
    import: "optional:configserver:http://localhost:9000"
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
    gateway:
      routes:
        - id: patient-service
          uri: http://localhost:8000
          predicates:
            - Path=/api/v1/patients/**
        - id: doctor-service
          uri: http://localhost:8001
          predicates:
            - Path=/api/v1/doctors/**
        - id: appointment-service
          uri: http://localhost:8002
          predicates:
            - Path=/api/v1/appointments/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowed-methods: "*"
            allowed-headers: "*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:9001/eureka/
